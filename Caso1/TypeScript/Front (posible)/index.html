<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BiciTaller - consola</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>BiciTaller</h1>
  <p>Escribe un comando (ej. <code>REPORTAR BIC-0412 frenos sueltos</code>) y presiona Enter o "Ejecutar".</p>

  <pre id="salida">Flota cargada desde taller.txt.</pre>

  <div class="barra">
    <input id="entrada" type="text" placeholder="RECIBIR BIC-0412" autofocus />
    <button id="ejecutar">Ejecutar</button>
    <button id="reporte">Reporte</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
